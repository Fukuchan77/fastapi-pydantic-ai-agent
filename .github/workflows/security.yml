name: Security Scan

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: security-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: pip-audit + gitleaks
    runs-on: ubuntu-latest
    # Bounded for the same reason as pr.yml: the 360-minute default is far
    # longer than any legitimate run of these two scanners.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise (installs uv per mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Audit dependencies (pip-audit)
        run: mise run audit

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
