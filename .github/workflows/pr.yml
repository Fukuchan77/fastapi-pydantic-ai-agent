name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test, Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise (installs uv per mise.toml)
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff + ty)
        run: mise run lint

      - name: Test (unit + integration + e2e, coverage gate)
        run: mise run test:ci

      - name: Audit dependencies (pip-audit)
        run: mise run audit
